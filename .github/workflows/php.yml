name: PHP Composer

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    compatibility:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - mode: tooling
                      php-version: "8.4"
                    - mode: without-tooling
                      php-version: "8.4"
                    - mode: runtime-lowest
                      php-version: "8.2"
                    - mode: dev-lowest
                      php-version: "8.2"
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none

            - name: Prepare isolated dependencies
              env:
                  COMPATIBILITY_MODE: ${{ matrix.mode }}
              run: |
                  compatibility_dir=$(mktemp -d)
                  echo "COMPATIBILITY_DIR=$compatibility_dir" >> "$GITHUB_ENV"
                  php test/Compatibility/prepare.php "$COMPATIBILITY_MODE" "$compatibility_dir"

            - name: Resolve and check dependencies
              env:
                  COMPATIBILITY_MODE: ${{ matrix.mode }}
              run: |
                  flags=()
                  if [[ "$COMPATIBILITY_MODE" == *-lowest ]]; then
                      flags+=(--prefer-lowest --prefer-stable)
                  fi
                  composer update --working-dir="$COMPATIBILITY_DIR" --no-plugins --no-scripts --prefer-dist --no-progress --no-interaction "${flags[@]}"
                  composer check-platform-reqs --working-dir="$COMPATIBILITY_DIR"

            - name: Verify compatibility
              env:
                  COMPATIBILITY_MODE: ${{ matrix.mode }}
              run: |
                  case "$COMPATIBILITY_MODE" in
                      tooling|without-tooling)
                          php test/Compatibility/console.php "$COMPATIBILITY_DIR/vendor/autoload.php" "$COMPATIBILITY_MODE"
                          ;;
                      runtime-lowest)
                          php test/Compatibility/runtime.php "$COMPATIBILITY_DIR/vendor/autoload.php"
                          ;;
                      dev-lowest)
                          php "$COMPATIBILITY_DIR/vendor/bin/phpunit" --configuration phpunit.xml.dist --bootstrap "$COMPATIBILITY_DIR/vendor/autoload.php" --testsuite unit
                          ;;
                  esac

            - name: Record resolved compatibility versions
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: compatibility-${{ matrix.mode }}-php${{ matrix.php-version }}
                  path: ${{ env.COMPATIBILITY_DIR }}/composer.lock

    downstream-mapper:
        name: Downstream mapper (PHP ${{ matrix.php-version }}, router ${{ matrix.router.label }}, ${{ matrix.dependencies }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.2", "8.3", "8.4", "8.5"]
                router:
                    - version: "^3.15"
                      label: "3.15"
                    - version: "^4.1"
                      label: "4.1"
                dependencies: [lowest, current]

        steps:
            # This checkout is the scanner revision under test (including PR merges).
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false

            # Pin the mapper to its latest reviewed main commit rather than following
            # its moving default branch during scanner pull-request validation.
            - name: Checkout downstream mapper
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  repository: sirix777/mezzio-valinor-request-mapper
                  ref: 6d1419fb599ba4a44a9e5ef59c63e6d069de6f59
                  path: downstream-mapper
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none

            - name: Resolve downstream dependencies against this scanner checkout
              working-directory: downstream-mapper
              env:
                  DEPENDENCY_SET: ${{ matrix.dependencies }}
                  ROUTER_CONSTRAINT: ${{ matrix.router.version }}
              run: |
                  set -euo pipefail
                  composer config repositories.routing-attributes '{"type":"path","url":"..","options":{"symlink":false,"versions":{"sirix/mezzio-routing-attributes":"1.4.x-dev"}}}'
                  composer config minimum-stability dev
                  composer config prefer-stable true

                  flags=(--with-all-dependencies --prefer-dist --no-progress --no-interaction --no-plugins --no-scripts)
                  if [[ "$DEPENDENCY_SET" == "lowest" ]]; then
                      flags+=(--prefer-lowest --prefer-stable)
                  fi

                  composer update \
                      --with='sirix/mezzio-routing-attributes:^1.4@dev' \
                      --with='sirix/mezzio-routing-contracts:^1.2.1' \
                      --with="mezzio/mezzio-router:${ROUTER_CONSTRAINT}" \
                      "${flags[@]}"

            - name: Verify resolved scanner source and dependency versions
              working-directory: downstream-mapper
              run: |
                  set -euo pipefail
                  composer show --format=json sirix/mezzio-routing-attributes | php -r '
                      $package = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
                      $source = $package["dist"] ?? [];
                      if (($source["type"] ?? null) !== "path" || ! isset($source["url"]) || realpath($source["url"]) !== realpath(getenv("GITHUB_WORKSPACE"))) {
                          throw new RuntimeException("The current scanner checkout was not selected.");
                      }
                  '
                  composer show sirix/mezzio-routing-attributes
                  composer show sirix/mezzio-routing-contracts
                  composer show mezzio/mezzio-router

            - name: Run downstream mapper suite
              working-directory: downstream-mapper
              run: composer test

    downstream-mapper-lowest-released:
        name: Downstream mapper lowest released scanner (PHP 8.2, router ${{ matrix.router.label }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                router:
                    - version: "3.15.0"
                      label: "3.15"
                    - version: "4.1.0"
                      label: "4.1"

        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  repository: sirix777/mezzio-valinor-request-mapper
                  ref: 6d1419fb599ba4a44a9e5ef59c63e6d069de6f59
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
              with:
                  php-version: "8.2"
                  coverage: none

            - name: Resolve lowest released scanner dependencies
              env:
                  ROUTER_CONSTRAINT: ${{ matrix.router.version }}
              run: |
                  set -euo pipefail
                  composer update \
                      --with='sirix/mezzio-routing-attributes:1.4.0' \
                      --with='sirix/mezzio-routing-contracts:^1.2.1' \
                      --with="mezzio/mezzio-router:${ROUTER_CONSTRAINT}" \
                      --with-all-dependencies --prefer-dist --no-progress --no-interaction --no-plugins --no-scripts

            - name: Verify resolved released dependency versions
              run: |
                  set -euo pipefail
                  composer show --format=json sirix/mezzio-routing-attributes | php -r '
                      $package = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
                      if (($package["versions"] ?? []) !== ["1.4.0"]) {
                          throw new RuntimeException("The lowest released scanner was not selected.");
                      }
                  '
                  composer show sirix/mezzio-routing-attributes
                  composer show sirix/mezzio-routing-contracts
                  composer show mezzio/mezzio-router

            - name: Run downstream mapper suite
              run: composer test

    qa:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.2", "8.3", "8.4", "8.5"]
                mezzio-router:
                    - version: "^3.15"
                      label: "3.15"
                    - version: "^4.1"
                      label: "4.1"
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict --no-check-lock --no-interaction

            - name: Install dependencies
              run: composer update --with "mezzio/mezzio-router:${{ matrix.mezzio-router.version }}" --prefer-dist --no-progress --no-interaction

            - name: Run composer normalize
              run: composer normalize

            - name: Analyse dependencies
              run: composer analyse-deps

            - name: Run cs-check
              run: composer cs-check

            - name: Run phpstan
              run: composer phpstan

            - name: Run phpunit
              run: composer test

            - name: Run benchmark smoke checks
              env:
                  BENCHMARK_ITERATIONS: 1
                  BENCHMARK_ROUTE_COUNTS: 10
              run: |
                  composer benchmark > /dev/null
                  composer benchmark-threshold > /dev/null

            - name: Verify benchmark large-corpus manifest transport
              env:
                  BENCHMARK_ITERATIONS: 1
                  BENCHMARK_ROUTE_COUNTS: 12800
              run: |
                  BENCHMARK_PROFILE=unique composer benchmark-threshold > /dev/null
                  BENCHMARK_PROFILE=mixed composer benchmark-threshold > /dev/null

            - name: Run benchmark report (non-blocking)
              continue-on-error: true
              run: composer benchmark > benchmarks/report.md

            - name: Upload benchmark artifacts
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: benchmark-report-php${{ matrix.php-version }}-router${{ matrix.mezzio-router.label }}
                  path: |
                      benchmarks/report.md
                      benchmarks/report.json

    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
              with:
                  php-version: "8.5"
                  coverage: pcov

            - name: Validate composer.json
              run: composer validate --strict --no-check-lock --no-interaction

            - name: Install dependencies
              run: composer update --with "mezzio/mezzio-router:^4.1" --prefer-dist --no-progress --no-interaction

            - name: Run coverage
              run: composer coverage | tee coverage.txt

            - name: Upload coverage artifact
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: coverage-report
                  path: coverage.txt

    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
              with:
                  php-version: "8.2"
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict --no-check-lock --no-interaction

            - name: Install dependencies
              run: composer update --with "mezzio/mezzio-router:^4.1" --prefer-dist --no-progress --no-interaction

            - name: Run phpunit
              run: composer test
