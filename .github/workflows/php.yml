name: PHP Composer

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    compatibility:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - mode: tooling
                      php-version: "8.4"
                    - mode: without-tooling
                      php-version: "8.4"
                    - mode: runtime-lowest
                      php-version: "8.2"
                    - mode: dev-lowest
                      php-version: "8.2"
        steps:
            - uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none

            - name: Prepare isolated dependencies
              env:
                  COMPATIBILITY_MODE: ${{ matrix.mode }}
              run: |
                  compatibility_dir=$(mktemp -d)
                  echo "COMPATIBILITY_DIR=$compatibility_dir" >> "$GITHUB_ENV"
                  php test/Compatibility/prepare.php "$COMPATIBILITY_MODE" "$compatibility_dir"

            - name: Resolve and check dependencies
              env:
                  COMPATIBILITY_MODE: ${{ matrix.mode }}
              run: |
                  flags=()
                  if [[ "$COMPATIBILITY_MODE" == *-lowest ]]; then
                      flags+=(--prefer-lowest --prefer-stable)
                  fi
                  composer update --working-dir="$COMPATIBILITY_DIR" --no-plugins --no-scripts --prefer-dist --no-progress --no-interaction "${flags[@]}"
                  composer check-platform-reqs --working-dir="$COMPATIBILITY_DIR"

            - name: Verify compatibility
              env:
                  COMPATIBILITY_MODE: ${{ matrix.mode }}
              run: |
                  case "$COMPATIBILITY_MODE" in
                      tooling|without-tooling)
                          php test/Compatibility/console.php "$COMPATIBILITY_DIR/vendor/autoload.php" "$COMPATIBILITY_MODE"
                          ;;
                      runtime-lowest)
                          php test/Compatibility/runtime.php "$COMPATIBILITY_DIR/vendor/autoload.php"
                          ;;
                      dev-lowest)
                          php "$COMPATIBILITY_DIR/vendor/bin/phpunit" --configuration phpunit.xml.dist --bootstrap "$COMPATIBILITY_DIR/vendor/autoload.php" --testsuite unit
                          ;;
                  esac

            - name: Record resolved compatibility versions
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: compatibility-${{ matrix.mode }}-php${{ matrix.php-version }}
                  path: ${{ env.COMPATIBILITY_DIR }}/composer.lock

    qa:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.2", "8.3", "8.4", "8.5"]
                mezzio-router:
                    - version: "^3.15"
                      label: "3.15"
                    - version: "^4.1"
                      label: "4.1"
        steps:
            - uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict --no-check-lock --no-interaction

            - name: Install dependencies
              run: composer update --with "mezzio/mezzio-router:${{ matrix.mezzio-router.version }}" --prefer-dist --no-progress --no-interaction

            - name: Run composer normalize
              run: composer normalize

            - name: Analyse dependencies
              run: composer analyse-deps

            - name: Run cs-check
              run: composer cs-check

            - name: Run phpstan
              run: composer phpstan

            - name: Run phpunit
              run: composer test

            - name: Run benchmark smoke checks
              env:
                  BENCHMARK_ITERATIONS: 1
                  BENCHMARK_ROUTE_COUNTS: 10
              run: |
                  composer benchmark > /dev/null
                  composer benchmark-threshold > /dev/null

            - name: Verify benchmark large-corpus manifest transport
              env:
                  BENCHMARK_ITERATIONS: 1
                  BENCHMARK_ROUTE_COUNTS: 12800
              run: |
                  BENCHMARK_PROFILE=unique composer benchmark-threshold > /dev/null
                  BENCHMARK_PROFILE=mixed composer benchmark-threshold > /dev/null

            - name: Run benchmark report (non-blocking)
              continue-on-error: true
              run: composer benchmark > benchmarks/report.md

            - name: Upload benchmark artifacts
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: benchmark-report-php${{ matrix.php-version }}-router${{ matrix.mezzio-router.label }}
                  path: |
                      benchmarks/report.md
                      benchmarks/report.json

    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  coverage: pcov

            - name: Validate composer.json
              run: composer validate --strict --no-check-lock --no-interaction

            - name: Install dependencies
              run: composer update --with "mezzio/mezzio-router:^4.1" --prefer-dist --no-progress --no-interaction

            - name: Run coverage
              run: composer coverage | tee coverage.txt

            - name: Upload coverage artifact
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: coverage-report
                  path: coverage.txt

    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.2"
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict --no-check-lock --no-interaction

            - name: Install dependencies
              run: composer update --with "mezzio/mezzio-router:^4.1" --prefer-dist --no-progress --no-interaction

            - name: Run phpunit
              run: composer test
